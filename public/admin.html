<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ConvoSurvey admin</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <div class="card">
      <h1>ConvoSurvey</h1>
      <p id="auth-sub" class="muted">Sign in to build surveys and read responses.</p>
      <div id="social" class="social" hidden>
        <a id="btn-google" class="btn social-btn" href="/auth/google/start" hidden>
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
          <span>Continue with Google</span>
        </a>
        <a id="btn-microsoft" class="btn social-btn" href="/auth/microsoft/start" hidden>
          <svg width="18" height="18" viewBox="0 0 23 23" aria-hidden="true"><path fill="#F25022" d="M1 1h10v10H1z"/><path fill="#7FBA00" d="M12 1h10v10H12z"/><path fill="#00A4EF" d="M1 12h10v10H1z"/><path fill="#FFB900" d="M12 12h10v10H12z"/></svg>
          <span>Continue with Microsoft</span>
        </a>
        <p class="or"><span>or use email</span></p>
      </div>
      <form id="login-form" autocomplete="on">
        <div class="field" id="name-field" hidden>
          <label for="nm">Name <span class="muted">(optional)</span></label>
          <input id="nm" type="text" autocomplete="name" maxlength="120">
        </div>
        <div class="field">
          <label for="em">Email</label>
          <input id="em" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="pw">Password</label>
          <input id="pw" type="password" autocomplete="current-password" required>
          <small id="pw-hint" class="muted" hidden>At least 8 characters.</small>
        </div>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button id="auth-submit" class="btn primary" type="submit">Sign in</button>
      </form>
      <p class="muted switch"><span id="switch-text">New here?</span> <button id="switch-mode" class="linkbtn" type="button">Create an account</button></p>
    </div>
  </div>

  <div id="app" hidden>
    <header class="nav">
      <a class="brand" href="#/">ConvoSurvey</a>
      <nav>
        <a class="btn ghost sm" href="#/">Surveys</a>
        <span id="who" class="muted who"></span>
        <button id="logout" class="btn ghost sm" type="button">Sign out</button>
      </nav>
    </header>
    <div id="banner" class="banner" hidden></div>
    <main id="view" class="view"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/admin.js"></script>
</body>
</html>
